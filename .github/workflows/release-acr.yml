name: Build and publish ACR image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WIKIJS_VERSION: v2.5.314
      WIKIJS_COMMIT: 6f042e97cc2d3acda6b6ff611de8e0faacce91c1
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_IMAGE: ${{ secrets.ACR_IMAGE }}
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Prepare upstream Wiki.js
        run: WIKI_COMMIT="${WIKIJS_COMMIT}" bash scripts/prepare-upstream.sh "${WIKIJS_VERSION}"

      - name: Mark upstream build as release
        working-directory: .build/wikijs
        run: |
          node -e "const fs = require('fs'); const file = 'package.json'; const pkg = JSON.parse(fs.readFileSync(file, 'utf8')); pkg.dev = false; pkg.version = process.env.WIKIJS_VERSION.replace(/^v/, ''); fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')"
      - name: Set image tag
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "tag=wikijs-${WIKIJS_VERSION}-nav-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .build/wikijs
          file: .build/wikijs/dev/build/Dockerfile
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.description=Wiki.js 2.5.314 with expandable multi-level navigation
          # ACR currently rejects BuildKit OCI attestation manifests
          # (application/vnd.oci.empty.v1+json). Keep the image portable.
          provenance: false
          sbom: false

      - name: Publish image digest
        run: |
          {
            echo '## ACR image'
            echo
            echo '\`${ACR_REGISTRY}/${ACR_IMAGE}:${{ steps.image.outputs.tag }}\`'
            echo
            echo 'Digest:'
            echo '\`${{ steps.push.outputs.digest }}\`'
          } >> "$GITHUB_STEP_SUMMARY"
